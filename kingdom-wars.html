<div class="wrap seo-text">
  <h1>Kingdom Wars</h1>
  <p>국가를 골라 달을 나눠 갖는 턴제 우주 전략</p>
  <p>국가와 사령관을 고르고 달의 49개 섹터를 한 칸씩 빼앗는다. 브라우저에서 바로 돌아가고, 설치가 없다. 화면 아래에는 지금 이 시각의 실제 뉴스가 흐른다.</p>
  <h2>왜 이렇게 만들었나</h2>
  <p>전략 게임은 대개 무겁다. 받고, 깔고, 튜토리얼을 듣고 나서야 첫 판이 시작된다. 그사이에 사람이 떠난다.</p>
  <p>그래서 설치를 없앴다. 주소를 누르면 바로 국가 선택 화면이고, 몇 번 누르면 첫 전투다. 게임 전체가 HTML 파일 하나로 돌아간다.</p>
  <p>가볍게 만들되 얕게 만들지는 않으려 했다. 연승이 쌓이면 배수가 붙고, 전투마다 등급이 매겨지고, 이겼을 때 유닛이 떨어진다. '한 판만 더'가 걸리는 지점을 의도적으로 설계했다.</p>
  <h2>전쟁은 어떻게 일어나는가</h2>
  <p>달은 7×7, 49개 섹터로 나뉜다. 각 섹터마다 지형과 자원이 다르고, 내 땅과 맞닿은 곳만 공격할 수 있다. 그래서 어디부터 먹느냐가 다음에 갈 수 있는 곳을 정한다.</p>
  <p>공격에는 세 가지 방식이 있다. 정면으로 가거나, 우회해서 치거나(+20%), 인접한 여러 칸에서 동시에 조여 들어간다(+15%). 같은 병력이어도 어떻게 들어가느냐로 결과가 갈린다.</p>
  <p>전투가 끝나면 등급이 나온다. S·A·B·C 네 단계이고 S는 보상이 두 배다. 이기기만 하는 것과 잘 이기는 것을 구분한다.</p>
  <ul>
  <li>유닛 구성 — 함선 5종, 메카 5종, 에이스. 등급 N / R / SR / UR</li>
  <li>공격 방식 — 정면 · 우회(+20%) · 포위(인접 +15%)</li>
  <li>사기 — 부대 상태가 전투력에 반영된다</li>
  <li>연승 배수 — 연승당 +8%, 최대 +60%</li>
  <li>크리티컬 — 15% 확률로 1.6배</li>
  </ul>
  <h2>실시간 데이터 — 진짜 뉴스가 흐른다</h2>
  <p>화면 아래 띠에는 지금 이 시각의 실제 뉴스가 지나간다. 플레이어가 고른 언어에 맞춰 해당 언어권 뉴스를 가져온다.</p>
  <p>우주 전쟁을 하는 화면 아래로 오늘의 실제 사건이 흐르면, 게임 속 2077년과 지금이 한 줄로 이어진다. 껐다 켜도 세상이 계속 돌아가고 있다는 감각이 남는다.</p>
  <p>네트워크가 막히거나 응답이 없을 때를 대비해 우주 관련 대체 뉴스를 준비해두었고, 10분간 캐시해서 같은 요청을 반복하지 않는다.</p>
  <ul>
  <li>Google News RSS — 언어별 실시간 뉴스 피드</li>
  <li>언어 연동 — 한국어·영어·일본어·중국어 각각의 뉴스권</li>
  <li>폴백과 캐시 — 응답이 없을 때의 대체 뉴스, 10분 캐시</li>
  </ul>
  <h2>무기와 군사 배치</h2>
  <p>함선 5종, 메카 5종, 그리고 에이스 유닛이 있다. 등급은 N·R·SR·UR 네 단계이고, 이기면 유닛이 전리품으로 떨어진다(8% 이상).</p>
  <p>자원은 헬륨-3, 코인, 물, 레골리스 네 가지다. 섹터마다 나오는 자원이 달라서, 어느 칸을 먹느냐가 곧 무엇을 더 만들 수 있느냐가 된다.</p>
  <p>시작 전력은 전투기 5기와 구축함 2기, 헬륨-3 3,500과 코인 1,500이다. 턴이 끝날 때마다 전투기가 한 기씩 보급된다 — 크게 지고도 다음 판을 시작할 수 있게 하는 최소한의 바닥이다.</p>
  <h2>하는 방법</h2>
  <ul>
  <li>국가를 고른다 — 한국, 미국 등</li>
  <li>사령관을 고른다. 사령관마다 성격이 다르다</li>
  <li>지도에서 내 땅과 맞닿은 섹터를 누른다</li>
  <li>보낼 유닛과 공격 방식(정면·우회·포위)을 정하고 출격한다</li>
  <li>결과 화면에서 등급과 전리품을 확인하고 턴을 넘긴다</li>
  <li>모바일에서는 화면 아래 유닛 바로 유닛을 고른다</li>
  </ul>
  <h2>AI와 공개 데이터 활용</h2>
  <p>이 항목은 확인된 것만 적는다.</p>
  <p>개발 전 과정에 AI 코딩 도구를 쓴다. 게임 로직, 4개 언어 현지화(UI 고정 문구와 게임 데이터 270개 이상을 2계층으로 분리), 자동화 테스트까지 이 방식으로 만들었다.</p>
  <p>게임 안의 이미지 자산은 생성형 AI로 만든다.</p>
  <p>공개 데이터는 Google News RSS다. 플레이어 언어에 맞춰 실시간 뉴스를 가져와 화면에 흘린다.</p>
