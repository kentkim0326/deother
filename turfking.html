<div class="wrap seo-text">
  <h1>터프 킹</h1>
  <p>4인 온라인 협동 벨트스크롤 — 네 것을 되찾아라</p>
  <p>자기 조직에 배신당한 다섯 도시의 조폭들이 같은 처지끼리 뭉쳐, 맨손으로 자기 나와바리를 되찾는 4인 협동 벨트스크롤. 「용과 같이」와 「더블드래곤」 사이의 손맛을 노린다. 아직 개발 중. ⚠️ 성인용 — 조직 폭력과 유혈이 나온다. 아이들용이 아니다.</p>
  <h2>버림받은 자들</h2>
  <p>너는 그들에게 전부를 줬다. 그들은 너를 버렸다.</p>
  <p>도쿄·서울·홍콩·뉴욕·런던 — 다섯 도시를 주름잡던 다섯 남자가 자기 조직에게 팔려나간다. 이제 그들에게 남은 건 서로, 그리고 아주 긴 이름들의 명단뿐이다.</p>
  <p>한 챕터가 그중 한 명의 귀향이다. 나머지 셋이 함께 간다. 배신한 보스를 쓰러뜨리면 그 도시가, 그리고 그 파이터가 내 것이 된다.</p>
  <h2>맨손, 4버튼</h2>
  <p>펀치·킥·잡기·구르기. 커맨드 입력도, 기술표도, 외워야 할 프레임 데이터도 없다.</p>
  <p>각 파이터는 200개가 넘는 고유 타격 애니메이션을 갖고, 게임이 그중 알맞은 것을 대신 골라준다. 플레이어는 그냥 계속 휘두르면 된다.</p>
  <p>이 손맛은 Deother 의 격투게임 Fighting Nations 에서 검증된 무브·타격감을 토대로 만든다 — 백지에서 시작하지 않는다.</p>
  <h2>서로 등지지 않고, 함께</h2>
  <p>최대 4인 드롭인 협동. 빈자리는 등을 봐주는 — 그러면서 잔소리도 하는 — AI 동료가 채운다.</p>
  <p>누군가 이기기 위해 누군가 질 필요가 없다. 등수도, 킬 경쟁도 없다. 각자의 통계(총 KO·최대 콤보·구출 횟수)만 남는다. 협동이 제로섬으로 무너지지 않게 설계한다.</p>
  <h2>지금 어디까지 — 개발 중</h2>
  <p>아직 기획이 확정된 단계다. itch 페이지는 다운로드 빌드가 아니라 개발 소개다 — "In development. Follow for updates."</p>
  <p>확정된 것과 앞으로 만들 것:</p>
  <ul>
  <li>✅ 기획·세계관 확정 (버림받은 자들, 다섯 도시)</li>
  <li>✅ 20명 파이터 로스터 · 컨셉 아트</li>
  <li>✅ FN 의 225개 무브·타격감 자산 재활용 경로</li>
  <li>⬜ 4인 온라인 협동 (온라인은 전부 새 작업)</li>
  <li>⬜ 다섯 도시 캠페인 (도쿄·서울·홍콩·뉴욕·런던)</li>
  <li>⬜ 도시 정복 = 파이터 획득</li>
  </ul>
