  <h1>김형섭 (Kent Kim)</h1>
  <p>게임을 만들기 전에, 이미 스무 해를 만들어온 사람</p>
  <p>디아더 대표. 하버드 기숙사에서 전 세계 1만 명에게 편지를 썼고, 동아일보에 만화를 연재했고, 갓을 쓰고 7개 국어로 힙합을 불렀고, 헐리우드 단편영화제에서 호러 부문 상을 받았고, 23권의 책을 냈다. 게임은 그 모든 것이 흘러든 마지막 그릇이다.</p>
  <h2>1만 통의 편지</h2>
  <p>이혼한 어머니를 찾아 미국으로 건너간 것은 고등학교 1학년 때였다. 고생하는 어머니를 보며 독하게 공부해 하버드에 들어갔다.</p>
  <p>대학 시절 전 세계의 정치·경제 리더 1만 명에게 편지를 썼다. 워런 버핏, 마거릿 대처, 잭 웰치, 코카콜라 회장, 미쓰비시 사장, 바이올리니스트 예후디 메뉴인, 에드워드 케네디 상원의원 등 100명이 넘게 답장을 보내왔다.</p>
  <p>2002년 어머니가 세상을 떠난 해부터 간증을 시작해, 전국의 교회와 고아원·대학교·외국어고등학교에서 25년째 강연하고 있다. KBS 아침마당에 세 번 출연했고, 세바시 154회 연사로 섰고, 안동MBC에서 하버드식 학습법을 20강으로 만들어 1년간 방송했다.</p>
  <h2>만화가에서 강연가로</h2>
  <p>경제학을 전공했지만 4학년 때 애니메이션 「하버드맨」을 직접 만들었다. 그 인연으로 2000년 동아일보에 명언만화를 1년간 연재했고, 같은 해 만화시집 『만화보다가 하버드갔습니다』를 냈다.</p>
  <p>월스트리트로 가는 길을 두고 만화를 택한 그때의 선택은 KBS 뉴스 「이 사람」에도 소개되었다.</p>
  <h2>미술가</h2>
  <p>외삼촌 이강소와 어머니 이강자는 모두 서울미대 출신으로 한국 미술에 이바지한 인물들이다. 어린 시절부터 그림의 영향 속에서 자랐다.</p>
  <p>고등학교 시절 백남준을 직접 만나 그 천재성에 영향을 받았다. 뉴저지 고등학교 때부터 한글을 활용한 화가로 뉴욕과 뉴저지에서 전시를 열었고, 백인이 많이 사는 뉴저지의 모리스 박물관에 2년 연속 선정되었다.</p>
  <p>1998년에는 「노인과 바다」의 배우 안소니 퀸이 연 서울 예술의전당 전시회에서 디렉터를 맡았다.</p>
  <p>2023년부터는 전국을 다니며 현장에서 그리는 라이브 페인팅을 이어오고 있다 — 가로수길에서 포항 호미곶까지, 133번째 그림까지 왔다. 2024년에는 한글 유화와 아크릴화를 전 세계 태권도 관장 300명에게 선물했다.</p>
  <h2>23권의 책</h2>
  <p>2000년부터 23권을 냈다. 1만 명에게 편지를 써 답장을 받은 이야기에서 시작해 공부법, 조기유학, 자기계발로 이어졌다.</p>
  <p>하버드에서 만든 시간관리법을 정리한 『하버드식 시간관리 켄트김의 타임블럭』이 대표작이다.</p>
  <h2>TAFA — 500곡</h2>
  <p>「학교 종이 땡땡땡」을 만든 김메리 여사를 뉴욕에서 만나 음악적 영감을 받았다.</p>
  <p>2012년부터 야구 모자 대신 조선의 갓을 쓰고 힙합을 부른다. 500곡이 넘는 곡을 직접 작사·작곡하고 한국어·영어·일본어·중국어·광둥어·독일어·베트남어 7개 국어로 직접 불렀다. 그중 407곡이 TAFA라는 이름으로 애플뮤직·스포티파이·아마존·네이버뮤직 등에 유통되고 있다.</p>
  <p>정부와 지자체에는 음원을 무료로 준다. 고용노동부 노동절, 대전 사이언스페스티벌, 대한민국 학생미술대전 로고송이 그렇게 나갔다. 2026년 4월 대전시 세계과학문화포럼 AI 로고송 공모에서는 장려상을 받았다.</p>
  <h2>연극과 영화</h2>
  <p>2012년 연극계의 스승인 여세진 선생의 지도로 연극을 두 번 올렸다.</p>
  <p>2017년에는 미국 헐리우드에서 열리는 AOF 단편영화제에 15분짜리 독립영화 「ELEGERE」를 만들어 출품했고, 호러 부문에서 수상했다.</p>
  <h2>소설가</h2>
  <p>대학 시절 속초와 설악산에서 한 달을 살며 글쓰기를 시작했다. 2025년 5월에는 처음으로 영문 SF 소설 『SERAPHIM: The Awakening of the Iron Dragon』을 미국 아마존에 냈다.</p>
  <p>한국 역사를 바탕으로 조선늑대, 저승사자, 도깨비왕 강도현, 루시퍼와 도깨비왕의 무등산 결전, 북미대륙을 발견한 장보고, 검은 화랑, 판문점, 미국이 사라진 날을 웹소설로 연재하고 있다. 디아더의 게임 여럿이 이 이야기들에서 나왔다.</p>
  <p>스티븐 킹의 영향으로, 그가 싫어하는 숫자 13을 써서 한국형 호러 13편을 준비하고 있다 — 하회탈, 특식, 보청귀, 문신귀, 보신탕, 고주병, 인삼밭, 전원주택, 사이비, 자율주행차, 아파트, 전자담배. 2026년 출간 예정이다.</p>
  <h2>게임 개발자</h2>
  <p>2025년 7월부터 두 달간 유니티를 배워 3D 격투 게임을 직접 만들었다. 그 게임으로 경기도콘텐츠진흥원에 선발되었고, 2025년 10월 gamescom asia x Thailand Game Show 한국관에 한국 게임 16개 중 하나로 부스를 열었다.</p>
  <p>10월부터 12월까지 다시 두 달 동안 언리얼 엔진으로 처음부터 개발해 해외 출시를 준비했다. 지금 디아더가 소개하는 게임은 열 종이다.</p>
  <h2>AI와 공공데이터</h2>
  <p>하버드에서 경제학을 전공하면서도 컴퓨터 공학 수업을 들었고, IT에 대한 관심은 그 뒤로도 끊긴 적이 없다.</p>
  <p>최근에는 공공데이터와 AI로 앱과 웹을 만들어, 정부와 지자체가 여는 AI 소프트웨어 공모전에 거의 전부 출품하고 있다. 인천국제공항공사 AI 공모전에서는 최우수상을 받았고, 그 결과 2026년 6월 인천공항 AI-PORT 구현을 위한 상생협력 업무협약을 맺었다.</p>
  <p>RAG를 활용한 LLM 애플리케이션 개발 과정을 수료했고, 인공지능 국제표준화 과정을 거쳤으며, 안철수 대표가 만든 동그라미 재단의 AI 바이브코딩 3기에 선발되었다.</p>
  <p>대한민국 정부와 지방자치단체가 여는 공모전 100여 개에 도전하고 있다. 한국콘텐츠진흥원과 경기콘텐츠진흥원에 등록해 미술 전시, 게임, 소설, 웹툰, 힙합, 영화, 웹소설을 가리지 않는다.</p>
