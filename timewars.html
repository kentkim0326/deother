  <h1>타임 워즈</h1>
  <p>열여섯 전사, 하나의 채석장, 총은 없다</p>
  <p>죽음의 순간에 각기 다른 시대에서 소환된 동서양 전사 열여섯이 채석장에서 근접 배틀로얄을 벌인다. 살아남은 단 한 사람만 자신이 살던 세계로 돌아간다. 총은 없다 — 칼·활·창·도끼·검뿐. 얼리 빌드이며, 곧 온라인 멀티플레이로 간다.</p>
  <h2>서하 — 아직 집에 못 간 소녀</h2>
  <p>주인공은 열여덟 살 서하. 아버지에게 버림받고 홀어머니 밑에서 자라며 미친 듯이 훈련해 양궁 금메달을 목에 걸었다.</p>
  <p>세상이 막 열리려던 밤, 마약에 취한 K팝 스타의 차가 그녀를 덮친다. 의식이 꺼지는 순간, 그녀는 타임 워즈에 서 있다 — 갑옷과 칼을 든 낯선 자들 사이에.</p>
  <p>아무도 현대 옷을 입은 어린 소녀를 위협으로 보지 않는다. 첫 전투에서 그녀는 활을 집는다. 손이 기억한다. 표적이 움직이고 반격한다는 것만 빼면, 그건 그녀가 평생 해온 일이었다.</p>
  <h2>열여섯, 하나의 자리</h2>
  <p>소환된 자들의 공통점은 둘이다 — 죽음 직전의 순간에 있었다는 것, 그리고 육체가 특출났다는 것. 사무라이, 중세 기사, 바이킹, 명나라 협객, 조선 무사, 그리고 서하처럼 뛰어난 현대의 운동선수들.</p>
  <p>규칙은 단순하다. 돌아갈 수 있는 자리는 하나뿐이다. 라스트맨 스탠딩. 시공이 무너지며 전장은 점점 좁아진다.</p>
  <p>동양과 서양, 고대와 현대가 한 아레나에 뒤섞인다. 말은 통하지 않아도 눈빛은 통하고, 돌아갈 자리가 하나이므로 동맹 뒤엔 배신이 따른다.</p>
  <h2>총은 없다 — 근접무기만</h2>
  <p>타임 워즈는 기술이 아니라 육체와 의지를 시험한다. 그래서 총기는 존재하지 않는다. 칼·활·창·도끼·검 — 고전과 중세의 근접무기뿐이다.</p>
  <p>열여섯 명은 저마다 다른 빌드와 무기를 갖는다. 검과 방패, 대도끼, 쌍검, 활. 채석장에 떨어져 열다섯 명의 경쟁자와 부딪히고, 마지막까지 선 자가 이긴다.</p>
  <p>조작: WASD 이동 · 마우스 시점 · 좌클릭 공격 · 우클릭 방어 · 스페이스 점프 · 시프트 대시.</p>
  <h2>지금 어디까지 — 얼리 빌드</h2>
  <p>itch 에 올라간 것은 얼리 빌드(v0.2)다. 무료(원하는 만큼 후원)로 받을 수 있다.</p>
  <p>지금 할 수 있는 것과 앞으로 올 것:</p>
  <ul>
  <li>✅ 16명 캐릭터 선택 (3D 전신 뷰어)</li>
  <li>✅ 채석장 배틀로얄 — 플레이어 + AI 15명</li>
  <li>✅ 근접 전투 (검·활·도끼·창) · 라스트맨 스탠딩</li>
  <li>⬜ 온라인 멀티플레이</li>
  <li>⬜ 추가 아레나 맵</li>
  <li>⬜ 축소되는 안전지대</li>
  </ul>
