  <h2>왜 계획을 공개하나</h2>
  <p>게임을 만드는 일과 그 게임을 세상에 내보내는 일은 다른 일입니다. 1인 개발이라 후자를 즉흥으로 하면 그해를 통째로 놓칩니다. 그래서 응모 가능한 트랙을 전부 세어 달력에 붙였고, 그 달력을 그대로 공개합니다.</p>
  <p>패턴이 하나 보였습니다. 접수는 상반기에 몰리고 개최는 하반기입니다. 38개 중 24개가 1월에서 6월 사이에 마감됩니다. 8월에 움직이기 시작하면 그해 대부분은 이미 지나간 뒤입니다. 2027년은 1월부터 시작합니다.</p>

  <h2>어떤 순서로 도전하나</h2>
  <p>1인 개발에서는 부스비보다 이동·체류비가 큽니다. 유럽·북미 현장 트랙은 참가비가 무료여도 실제 비용이 가장 큽니다. 그래서 순서를 정해 두었습니다.</p>
  <p>주력은 Fighting Nations입니다. 격투 장르는 대형 종합 페스티벌과 어워드에서 강하고, 장르를 한정하는 스팀 이벤트에서는 약합니다. Kingdom Wars는 브라우저 게임이라 물리 부스 트랙에서는 빠지고, 전략 장르 온라인 이벤트와 무료 스팀 이벤트로 따로 나갑니다.</p>
  <ul>
  <li>① 온라인·심사형 무료 트랙 — 이동비가 들지 않습니다</li>
  <li>② 국내 — 지스타, BIC 페스티벌</li>
  <li>③ 아시아 근거리 — 타이베이, 방콕, 교토</li>
  <li>④ 유럽·북미 — 선정되거나 동행 지원이 붙을 때</li>
  </ul>
