  <h1>북미대륙을 발견한 장보고</h1>
  <p>실제 세계 지도 위에서 벌이는 9세기 해상무역 경영</p>
  <p>완도 어부의 아들이 당나라를 거쳐 해상왕이 된다. 실제 좌표의 항구를 오가며 교역으로 부를 쌓고, 거북선으로 해적을 소탕하며, 각지의 인물과 관계를 맺어 세계로 뻗는 교역 가문을 이룬다. 정사 위에 원작 소설의 대체역사를 얹었다 — 콜럼버스보다 650년 먼저 북미에 닿는 길.</p>
  <h2>왜 이렇게 만들었나</h2>
  <p>9세기에 실제로 황해를 주름잡은 해상왕 장보고가 있었다. 그 정사 위에, 장보고가 염장의 암살을 피해 살아남았다면 어디까지 갔을까 하는 원작 소설의 대체역사를 얹었다. 완도에서 당나라로, 다시 쿠로시오 해류를 타고 콜럼버스보다 650년 먼저 북미로.</p>
  <p>가상의 지도를 그리지 않았다. 양주·등주·청해진·경주·쓰시마·하카타·나니와, 그리고 시애틀 — 실제로 존재하는 항구의 실제 좌표를 쓴다. 항해 거리도 그 좌표로 계산된다.</p>
  <p>전략·경영 게임은 무겁다는 통념을 깼다. 설치 없이 브라우저에서 바로 돌아간다. 완도 출생부터 시작하는 프롤로그로 인물에 정을 붙인 뒤에 교역의 바다를 연다.</p>
  <h2>어떻게 부를 쌓는가 — 해상 교역</h2>
  <p>항구마다 상품 시세가 다르다. 비단·청자·차·인삼·은·서적·모피·삼나무를 싼 곳에서 사서 비싼 곳에 판다. 사면 오르고 팔면 내리는 시장 반응이 있어 한 항구에 몰아 팔 수는 없다.</p>
  <p>매입에는 나라별 관세가, 매도에는 저잣거리와 독점 교역권 보너스가 붙는다. 어느 항로를 여느냐가 곧 시세차익이고, 번 돈은 배와 거점을 키우는 데 들어간다.</p>
  <ul>
  <li>상품 시세 — 기준가 × 항구별 계수 × 동적 변동</li>
  <li>관세 — 당·신라·일본 등 나라마다 다른 매입세</li>
  <li>저잣거리·독점 교역권 — 매도 보너스</li>
  <li>강화 — 배(적재·속도·무장)와 거점(창고·저잣거리·병영)</li>
  </ul>
  <h2>항해와 거북선 해전</h2>
  <p>항해 일수는 실제 좌표 사이의 거리로 계산된다. 배가 항로를 따라 움직이고, 북미(시애틀)는 하카타에서 쿠로시오 곡선 경로(일본→알류샨→북미)로만 닿는다.</p>
  <p>도착할 때마다 사건이 기다린다 — 해적 조우, 폭풍, 뇌물을 요구하는 부패 관리, 난파선, 순풍. 곁에 둔 인재의 행운이 악재 확률을 낮춘다.</p>
  <p>해적은 거북선 기함으로 소탕한다. 충파·화공·궁수·철갑 방어의 턴제 해전이고, 무장과 병영이 공격·방어·체력에 반영된다. 소탕은 곧 그 항로를 여는 일이다.</p>
  <h2>세계로 뻗는 교역 가문</h2>
  <p>삼국지식 인물 관계 시스템이 있다. 각지의 인물을 그 거점 항구에서 만나 호감을 세 단계로 쌓는다.</p>
  <p>무역상은 영입해 매매를 유리하게 만들고, 각지의 여인과는 혼인해 가문을 이룬다 — 가문은 항해마다 자동 수익을 낳는다. 왕에게 진상하면 그 나라의 독점 교역권이 열린다. 각 지역의 여인이 앵커가 되고 자녀가 그 지역 교역망을 맡는다.</p>
  <p>성공할수록 진골 귀족의 경계가 커진다. 반복되는 자객을 정보망으로 막아야 하고, 4막에서 정사(염장의 암살)와 소설(탈출과 대항해)이 갈린다.</p>
  <h2>하는 방법</h2>
  <ul>
  <li>완도 출생부터 시작하는 프롤로그로 장보고의 성장을 따라간다</li>
  <li>항구를 골라 시장에서 상품을 사고판다</li>
  <li>항로를 정해 항해한다 — 도착 시 사건이나 전투가 벌어진다</li>
  <li>거북선 해전은 공격 방식(충파·화공·궁수)과 방어를 골라 턴제로 싸운다</li>
  <li>배와 거점을 강화하고, 각지 인물과 관계를 맺어 가문을 넓힌다</li>
  <li>순자산 마일스톤을 밟는다 — 청해진 → 황해의 지배자 → 해상왕</li>
  </ul>
  <h2>AI와 공개 지도 데이터</h2>
  <p>이 항목은 확인된 것만 적는다.</p>
  <p>개발 전 과정에 AI 코딩 도구를 쓴다. 단일 HTML 파일 하나로 지도·경제·전투·인물 관계·다국어·오디오가 모두 도는 것이 그 결과다. 게임 안의 이미지 자산은 생성형 AI로 만든다.</p>
  <p>지도는 MapLibre GL JS 위에 OpenFreeMap(OpenStreetMap 계열 공개 지도 데이터)을 얹는다. 현대의 라벨과 도로를 걷어내 고지도 무드로 칠하고, 실제 좌표 위에 9세기 교역로와 오가는 배들을 그린다. 실좌표는 장식이 아니라 항해 거리 계산의 입력값이다.</p>
  <h2>항해의 과학 — 7~11세기</h2>
  <p>게임 속 교역과 항해는 그 시대에 실제로 쓰인 과학과 기술 위에 세웠다. 아래는 7~11세기 원양 항해를 떠받친 도구·기술·자연 지식이다.</p>
  <p>다만 두 가지는 재미를 위해 시대를 앞당긴 창작임을 밝혀둔다 — 철갑 거북선은 실제로는 15~16세기 조선의 배이고, ‘콜럼버스보다 먼저 북미 도달’은 원작 소설의 대체역사다.</p>
  <ul>
  <li>계절풍(몬순) — 인도양의 여름·겨울 바람. 아랍·페르시아 상인이 그 주기에 맞춰 원양을 왕복했다</li>
  <li>별자리 항법 — 북극성 등 별의 고도로 위도를 가늠하던 밤바다의 길잡이</li>
  <li>카말(kamal) — 나뭇조각과 매듭 끈으로 별 고도를 재는 아랍·인도양 뱃사람의 간이 도구</li>
  <li>아스트롤라베 — 이슬람 천문학이 정교화한 관측기구(8~10세기). 별·해의 고도와 방위·시각을 잰다 (바다 전용 간이형은 후대)</li>
  <li>측심연(납추 줄) — 수심을 재고 추 밑의 기름으로 바닥 흙을 떠 위치를 짐작하던 연안 항해의 필수 도구</li>
  <li>축 방향타·수밀 격벽 — 중국 정크선의 기술. 큰 배의 조종과 침수 대비를 가능케 했다</li>
  <li>쿠로시오 해류(흑조) — 일본 동쪽을 북동으로 흐르는 따뜻한 해류. 해류를 읽는 것은 원양 항해의 기본이었고, 게임에선 이 물길을 타고 북미로 간다</li>
  <li>자석 나침반 — 자화된 바늘은 심괄 『몽계필담』(1088)에 또렷이 기록됐고, 배 항해에 쓴 기록은 12세기 초다. 장보고 시대(9세기)엔 아직 별과 바람에 의지했다</li>
  </ul>
