<div class="wrap seo-text">
  <h1>Fighting Nations — 주식회사 디아더</h1>
  <p>총·칼 없이 오직 맨손 무술로. 1:1에서 시작해 64인 무술 배틀로얄을 지향합니다.</p>
  <h2>아무도 채우지 않은 공백</h2>
  <p>격투 게임은 1:1에 갇혔고, 배틀로얄은 총으로 포화됐습니다.</p>
  <h2>왜 시작했나</h2>
  <h2>직접 쓴 소설에서</h2>
  <h2>이 게임만의 것</h2>
  <ul>
  <li>무기는 없습니다 — 무에타이, 태권도, 쿵푸, 유도, 펜짝 실랏 — 11종 무술에서 계속 늘려갑니다. 무기를 빼는 건 설계이기도 하고, 부모가 걱정하지 않아도 되게 하려는 것이기도 합니다.</li>
  <li>1:1을 넘어 팀전으로 — 지금은 게임패드 두 개로 한 화면에서 1:1입니다. 멀티플레이어는 테스트 중입니다. 다음이 2:2, 그다음 팀 규모 확대 — 종착점은 64인 무술 배틀로얄입니다.</li>
  <li>스킨이 아니라 기술을 삽니다 — 외형만이 아니라 무술 스킬 자체를 구매하고 키웁니다. 무료 게임이되, 성장에 의미가 있습니다.</li>
  <li>당신 나라의 무술 — 각 파이터는 한 나라와 그 나라의 무술을 대표합니다. 13개국 캐릭터가 각자의 모국어로 말합니다 — 인도, 중국, 파키스탄, 미국, 영국, 브라질, 러시아, 태국, 인도네시아, 나이지리아, 한국, 일본. 캐릭터 모델은 메타휴먼으로 다시 만들고 있습니다.</li>
  </ul>
  <h2>어떻게 발전해왔나</h2>
  <p>공개된 자리에서, 한 걸음씩.</p>
  <ul>
  <li>2019년부터 매년 — 부산 지스타 G-CON 컨퍼런스 참가</li>
  <li>2019년 9월 — 도쿄 게임쇼 참가</li>
  <li>2022년 8월 — 독일 게임스컴에 디아더 부스 참가</li>
  <li>2022년 9월 — 도쿄 게임쇼에 디아더 부스 참가</li>
  <li>2023년 1월 — 미국 CES 에 디아더 부스 참가</li>
  <li>2025년 5월 24일 — 원작 소설 『SERAPHIM: The Awakening of Iron Dragon』 아마존 출간 — 게임보다 세계가 먼저 있었습니다</li>
  <li>2025년 여름 — 유니티로 프로토타입 제작</li>
  <li>2025년 8월 25~26일 — 언리얼 페스트 서울 2025 참가 (코엑스) — 두 달 뒤 언리얼로 재제작을 시작했습니다</li>
  <li>2025년 9월 17일 — K-Style Expo Q3 2025 (온라인) — 피칭 7개사에 선정되어 심사위원·투자자 앞에서 영어 IR 발표. 발표 순서는 첫 번째였습니다.</li>
  <li>2025년 9월 19일 — AsiaStartupExpo Q3 2025 (온라인) — 아시아 스타트업 10개사 숏리스트에 선정, 글로벌 투자자 대상 영어 피칭</li>
  <li>2025년 9월 19일 — 글로벌 비즈니스 라운드 테이블 2025 (문화체육관광부·한국콘텐츠진흥원, 코엑스) — 해외비즈니스센터들과 1:1 수출 상담</li>
  <li>2025년 9월 25~26일 — 스타트업콘 2025 — 국내외 투자사 일곱 곳과 1:1 밋업</li>
  <li>2025년 10월 6일 — 영문 매체 KoreaProductPost 에 Fighting Nations 소개 기사 게재</li>
  <li>2025년 10월 16~19일 — gamescom asia x Thailand Game Show — 16개 한국 게임사 중 하나로 선발, 메가존 클라우드 후원 한국관 부스. 인도·베트남·인도네시아·태국·필리핀·러시아·네덜란드·대만 배급사들이 부스를 찾았습니다. 현장에서 태국 배급사 Debuz 와 상호 협력 MOU 를 체결했습니다.</li>
  <li>2025년 10월 — 언리얼 엔진으로 재제작 — 멀티플레이어에는 언리얼이 필요했습니다</li>
  <li>2025년 10월 21일 — 젬파이 밋업 제35회 — 글로벌 게임 생태계 네트워킹(서울 역삼)에서 피칭</li>
  <li>2025년 10월 31일 — 2025 G-GAME Connect (경기콘텐츠진흥원) — 투자유치역량강화프로그램 10개사에 선정, VC 대상 IR 발표</li>
  <li>2025년 10월 31일 — Pocket Gamer Connects Summit Korea 2025 참석 — 글로벌 게임 산업 컨퍼런스</li>
  <li>2025년 11월 6~7일 — 콘솔게임 개발자 컨퍼런스(CGDC) 2025 참석 — 판교. 로드맵의 콘솔 진출을 준비하는 자리였습니다</li>
  <li>2025년 11월 29일 — 글로벌게임챌린지 2025 「우수 인디게임 초청전」 — 20작품 내외 선정작으로 초청되어 중앙대학교 100주년기념관에서 전시 (한국게임학회 주최)</li>
  <li>2025년 12월 31일 — NC소프트 제2회 바르코 게임 공모전 접수</li>
  <li>2026년 1월 16일 — 네오위즈 퀘스트 내러티브 인디게임 공모전 접수 (총 상금 1억 6,500만원)</li>
  <li>2026년 8월 21일 — 제1회 동그라미재단 AI 컨퍼런스에서 발표 — 「6개월 동안 앱 50개, 게임 8개 만들기」 (서울 종로). 넉 달 전 이 재단의 AI 아카데미를 수료했던 자리입니다</li>
  </ul>
  <h2>우리가 만든 것</h2>
  <p>게임 열 종을 만들었습니다. 그 바탕이 되는 IP — 소설·웹소설 — 도 직접 씁니다.</p>
  <p>200개국의 무술, 실제 도시의 좌표, 국기를 단 부대 — 우리 게임에는 늘 국가가 있습니다. 어느 나라를 강하게 만들기 위해서가 아니라, 어느 나라 사람이든 자기 자리를 찾을 수 있게 하기 위해서입니다.</p>
  <h2>앞으로</h2>
  <ul>
  <li>GWB 게임 어워드 — 텐센트 — 국제 인디 게임 대회에 출품합니다. 심사위원에게 현재 빌드를 제공합니다 — 21명의 파이터, 6개 스테이지.</li>
  <li>스팀 페이지 — Steamworks Direct로 등록하고 출시 예정 페이지를 올립니다. 출시 전부터 위시리스트를 모으기 위해서입니다.</li>
  <li>에픽 게임즈 스토어 — 스팀과 함께 유통 신청을 넣습니다.</li>
  <li>온라인 멀티플레이어 — 1:1 넷코드가 먼저이고 그다음이 2:2 팀전입니다. 그 사이 캐릭터 모델을 메타휴먼으로 옮깁니다.</li>
  <li>엑스박스 콘솔 — 마이크로소프트 ID@Xbox 프로그램에 신청해 콘솔로 갑니다.</li>
  <li>무술 배틀로얄 — 지금은 1:1. 다음은 2:2. 그다음 팀 규모를 키우고, 마지막에는 맨손 64명이 한 경기장에. 64는 임의의 숫자가 아닙니다 — 토너먼트 대진표이고, 이 게임은 대회에서 시작됐습니다.</li>
  </ul>
  <h2>만드는 사람</h2>
  <ul>
  <li>한국·미국에서 23권 출간 · 2012년부터 스포티파이에 407곡 발매</li>
  <li>23년 이상 무술 수련: 유도, 복싱, 합기도, 해동검도 1단(1999), 무에타이, 태권도, 소림권</li>
  <li>AI 인천공항 공모전 최우수상 · AI 음원 전국체전 공모전 제주도지사상 · 안철수재단(동그라미재단) AI 바이브 코딩 3기 수료 — 2026년 4월</li>
  <li>이 게임의 원작 소설 『SERAPHIM: The Awakening of Iron Dragon』 저자</li>
  <li>2022년 메타버스 플랫폼 2개 런칭. 투자 시장이 얼어붙어 서버는 내렸지만 배운 것은 남았습니다 — 엔드골이 없으면 사람이 남지 않는다, 그리고 게임에는 그것이 있다. 밀리버스는 다시 살아나 지금도 만들고 있습니다.</li>
  <li>2019년부터 도쿄 게임쇼 참관 · 2020년 Evo Japan 방문 및 소프트뱅크 도쿄 본사 방문 · 2022년 소프트뱅크 임원 미팅</li>
  <li>게임스컴 2022(독일), 도쿄 게임쇼 2022, CES 2023(라스베가스) 부스 운영 · 2019년부터 매년 부산 지스타 참가</li>
  </ul>
