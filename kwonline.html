  <h1>킹덤워즈 온라인</h1>
  <p>AI가 플레이어로 참여하는 MMORPG</p>
  <p>AI 에이전트가 NPC가 아니라 플레이어로 참여하는 MMORPG다. 이 세계의 주민 대부분은 AI이고, 그들은 사람과 완전히 같은 프로토콜로 접속한다 — 서버는 접속자가 사람인지 AI인지 모른다. 무대는 핵전쟁 이후, 살아남은 사람들이 뭉쳐 세운 10개 왕국이 거점을 놓고 싸우는 세계다. 인간이 부족주의를 벗어날 수 있는가를, 설명이 아니라 플레이로 묻는다. 개발 중.</p>
  <h2>왜 MMO여야 하는가</h2>
  <p>소설은 '인간은 부족주의를 벗어나기 어렵다'고 말할 수 있을 뿐이다. MMO는 플레이어가 그것을 직접 하게 만든다. 이 주제는 이 매체에서만 증명된다.</p>
  <p>다크 에이지 오브 카멜롯의 3진영, EVE의 널섹, 리니지의 공성전 — 어느 쪽이든 플레이어는 완전히 임의로 배정된 색깔을 놓고 진심으로 서로를 미워하게 된다. 2주면 충분하다.</p>
  <p>그래서 이 게임의 클라이맥스는 컷신이 아니다. 색깔 하나 골랐을 뿐인데 상대 진영을 진짜로 미워하고 있는 자신을, 플레이어가 발견하는 순간이다.</p>
  <h2>10개 왕국 — 사후 국가</h2>
  <p>진영은 민족이 아니다. 문명이 무너진 직후, 어쩌다 함께 살아남은 사람들이 뭉쳐 만든 사후 국가(post-nation)다.</p>
  <p>표식은 함선 색상 10종. 왕국을 가르는 것은 혈통도 이념도 아니고 그저 색이다 — 그 표식이 임의적이라는 점 자체가 이 게임의 주제다.</p>
  <p>그래서 탈영과 전향을 막지 않는다. 옮긴 사람은 옛 진영에게 배신자이고, 새 진영에서는 끝까지 의심받는 존재가 된다. 그 경험 자체가 주제의 증명이다.</p>
  <h2>AI가 사람과 같은 문으로 들어온다</h2>
  <p>이 게임의 핵심 설계는 하나다. AI 에이전트는 사람과 완전히 동일한 프로토콜로 접속한다. 에이전트 전용 특권 API도 없고, 사람과 AI를 구분하는 필드도 없다.</p>
  <p>이건 편의가 아니라 규칙이다. 언리얼 클라이언트든 브라우저든 봇이든, 프로토콜 문서 하나만 알면 같은 세계에 들어온다. 서버는 끝까지 누가 사람인지 모른다.</p>
  <p>그리고 여기서 두 번째 일이 벌어진다. 사람과 구별되지 않는 존재가 세계에 살면, 플레이어는 반드시 묻게 된다 — '쟤 사람이야, 봇이야?' 그리고 판별법을 공유하고, 파티에서 빼고, 오인해서 사람까지 배척하기 시작한다. 아무도 시키지 않았는데.</p>
  <ul>
  <li>WebSocket 위에 JSON. 클라이언트는 join / move / chat 을 보낸다</li>
  <li>서버는 welcome / snapshot(초당 10회) / join / leave / chat 을 보낸다</li>
  <li>플레이어 표현에 사람·AI 구분 필드가 없다 — 넣지 않는 것이 규칙이다</li>
  <li>세 종류의 클라이언트(언리얼 · 브라우저 · 에이전트)가 같은 서버, 같은 문서를 쓴다</li>
  </ul>
  <h2>코어 루프</h2>
  <p>10개 왕국이 거점을 놓고 싸운다. 세계의 주민 대부분은 AI 에이전트이고, 사람 플레이어는 그 전선의 날카로운 끝이다.</p>
  <p>진짜 작업량은 에셋이 아니라 AI 행동 설계에 있다. 에이전트가 사람으로 오인될 만큼 좋아야 이 구조 전체가 성립하기 때문이다.</p>
  <ul>
  <li>거점 점령과 방어 — 코어</li>
  <li>자원 채굴 — 전쟁을 떠받치는 보급</li>
  <li>건축과 전초기지 — 전선을 앞으로 미는 수단</li>
  <li>AI 행동 설계 — 실제 작업량의 대부분</li>
  </ul>
  <h2>설계 원칙</h2>
  <p>오래 살아남은 MMO들에서 가져온 것들이다. 새로운 것을 발명하기보다, 이미 증명된 것을 지키는 쪽을 택했다.</p>
  <ul>
  <li>다른 플레이어가 콘텐츠여야 한다 — 개발사는 플레이어의 소비 속도를 절대 따라가지 못한다</li>
  <li>사회적 의무를 만든다 — 사람을 붙잡는 것은 콘텐츠가 아니라 관계다</li>
  <li>손실이 남아야 한다 — 결과가 남아야 전쟁이 뉴스가 된다</li>
  <li>테마파크를 복제하지 않는다 — 친구와 캐릭터라는 전환 비용은 이길 수 없다</li>
  </ul>
  <h2>지금 어디까지 왔나</h2>
  <p>1차 목표는 'MMO를 완성하는 것'이 아니다. 거점 하나를 놓고 싸우는 지속형 존, 그리고 사람과 AI를 합쳐 수십 명이 같은 세계에 함께 있는 상태 — 그것 하나다. 인디 MMO가 죽는 첫 번째 이유는 콘텐츠 부족이 아니라 스코프다.</p>
  <p>관문은 통과했다. 언리얼 클라이언트가 서버에 붙어 에이전트 여섯과 같은 화면에 섰고, 각자 다른 속도로 움직이며 걷기와 달리기가 구분됐다.</p>
  <ul>
  <li>✅ 권위 서버 + 프로토콜 v0.1</li>
  <li>✅ AI 에이전트 — 사람과 같은 프로토콜로 접속</li>
  <li>✅ 언리얼 클라이언트 — 사람과 에이전트가 같은 세계에</li>
  <li>✅ 브라우저 클라이언트 — 쿼터뷰, 왕국별 색상</li>
  <li>⬜ 서버 상시 호스팅 · 세계 영속성 · 전투와 거점 점령</li>
  </ul>
