  <h1>저승사자</h1>
  <p>조선의 저승사자, 되살아난 망령을 벤다</p>
  <p>검은 갓을 쓴 조선의 저승사자가 되살아난 망령 떼를 카타나·주먹·발로 벤다. 부위를 하나씩 절단하고, 시체는 래그돌로 굴러 벽에 부딪힌다. DMC류 스타일리시 액션. ⚠️ 성인용 — 극심한 고어와 폭력.</p>
  <h2>저승사자 백무진</h2>
  <p>밀리의 서재에 연재 중인 원작 웹소설을 바탕으로 한다. 주인공은 백무진 — 고려 말, 멸문한 장군의 아들이다.</p>
  <p>열여섯에 장원급제한 그는 조선 건국기에 아버지가 역적으로 몰리며 온 가족의 비극을 지켜본다. 끝내 망나니의 칼에 목이 잘려 죽지만, 거기서 끝나지 않는다.</p>
  <p>그는 저승사자로 다시 태어나, 억울한 혼들을 저승으로 이끄는 길 위에 선다. 죽고 싶어도 죽을 수 없는 운명이다.</p>
  <h2>베고, 절단한다</h2>
  <p>칼·주먹·발을 스윙마다 랜덤으로 섞어 콤보를 낸다. 검을 휘두를 때마다 불·얼음·번개 같은 원소 슬래시 트레일이 칼에 감긴다.</p>
  <p>2단 점프와, 공격에 맞춰 줌인하는 다이나믹 시네마틱 카메라. 손맛은 스타일리시 액션(DMC류)을 노린다.</p>
  <h2>끊임없는 망령</h2>
  <p>적은 모듈러 좀비다. 팔·다리·머리가 한 부위씩 분리되고, 잘린 부위는 사라지지 않고 땅에 굴러 계속 찰 수 있다. 첫 타격에 몸통이 래그돌로 무너지며 벽으로 날아간다.</p>
  <p>혈흔, 뼈 부러지는 임팩트음, 죽는 비명. 망령은 끝없이 스폰된다 — 떼를 견디는 게임이다. ⚠️ 극심한 고어와 폭력, 성인용.</p>
  <h2>지금 어디까지 — 얼리 빌드</h2>
  <p>itch 에 올라간 것은 초기 빌드다. 무료(원하는 만큼 후원)로 받을 수 있다.</p>
  <p>지금 할 수 있는 것과 앞으로 올 것:</p>
  <ul>
  <li>✅ 저승사자로 망령 떼와 전투 (칼·주먹·발 콤보)</li>
  <li>✅ 부위 절단 · 래그돌 고어 · 원소 슬래시 트레일</li>
  <li>✅ 2단 점프 · 다이나믹 전투 카메라 · 끝없는 스폰</li>
  <li>⬜ 낙선재(창덕궁) 궁궐 스테이지</li>
  <li>⬜ 8방향 회피·구르기</li>
  <li>⬜ 백무진의 이야기</li>
  </ul>
