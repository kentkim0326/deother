<div class="wrap seo-text">
  <h1>숨바</h1>
  <p>조선 궁궐 지붕을 뛰어넘어 남자친구를 구하는 도주 게임</p>
  <p>한 번도 한국에 와본 적 없는 교포 여성과 미국인 남자친구가 여름 해변에서 오백 년 전 조선으로 떨어진다. 궁궐은 괴물로 뒤덮였고, 남자친구는 눈앞에서 끌려간다. 그녀는 이 나라 말을 한마디도 못 한다. 무기가 아니라 이동으로 살아남는 1인용 도주 게임.</p>
  <h2>여자가 남자를 구한다</h2>
  <p>전통적인 게임은 남자 영웅이 공주를 구했다. 이 게임은 그 반대다. 남존여비가 뿌리 깊은 조선에서, 여자가 남자를 구한다.</p>
  <p>그녀는 수영복 차림이고 말도 통하지 않는다. 그 사회는 그녀를 인정하지 않는다 — 조선 여자들은 혀를 차며 이상한 여자 취급을 한다. 그런데 그녀는 개의치 않고 궁궐 지붕 위를 뛰어다닌다.</p>
  <p>지붕은 이 세계에서 두 번 금기다. 궁궐에서 밟으면 안 되는 곳이고, 여자가 해서는 안 되는 짓이다. 그래서 지붕 위를 달리는 것이 곧 이 캐릭터의 성격이 된다.</p>
  <h2>지붕 — 금기이자 지름길</h2>
  <p>궁궐 지붕은 서로 이어져, 지상과 분리된 상층 루트가 된다. 지붕은 빠르지만 사방에서 보이고, 기와는 시끄럽다. 지상은 느리지만 몸을 숨길 수 있다.</p>
  <p>괴물 대부분은 지붕에 못 올라온다. 다만 늑대인간은 올라온다 — 지붕이 절대 안전지대가 되지는 않는다.</p>
  <p>일부 낡은 기와는 밟으면 무너져 실내로 추락한다. 피해를 입고, 큰 소음이 나고, 예상 못 한 곳에 떨어진다.</p>
  <h2>들면 봉인</h2>
  <p>무언가를 손에 들면 지붕에 오르지 못하고 담도 넘지 못한다. 갈 때는 지붕으로 빠르게, 돌아올 때는 지상으로 느리게.</p>
  <p>한 번에 하나만 옮긴다. 위급하면 내려놓고 도망쳤다가 나중에 회수한다. 이 비대칭 하나가 매 판을 '어느 길로 갈까'라는 루트 설계 문제로 만든다.</p>
  <h2>소음이 몰아온다</h2>
  <p>걷기는 무음, 달리기는 작게, 기와를 밟으면 중간, 무언가를 뽑으면 크게, 기와가 무너지면 가장 크다. 소음이 괴물을 불러 모은다.</p>
  <p>그래서 매 순간 '천천히 갈까, 빨리 갈까'를 정하게 된다. 조용함과 속도를 맞바꾸는 결정이 계속 이어진다.</p>
  <h2>괴물보다 사람이 더 차갑다</h2>
  <p>궁궐에는 살아남은 조선 사람들이 있다. 그들은 그녀를 돕지 않는다. 말을 걸어도 못 알아듣고, 조선 사람인 줄 알았다가 말이 안 통하니 더 이상하게 본다. 문을 열어주지 않고, 지나가면 혀를 찬다.</p>
  <p>그리고 옷이 통행증이 된다. 조선 옷을 갖춰 입으면 사람들이 받아주기 시작하지만, 그럴수록 지붕을 타기가 불편해진다. 받아들여질 것인가, 자유로울 것인가 — 이 맞바꿈이 주제와 메커닉을 한 번 더 묶는다.</p>
  <p>한국어를 못 하니 현판도 표지판도 못 읽는다. 그래서 미니맵에 목표가 표시되지 않는다. 길찾기는 순수하게 지형을 기억하는 것뿐이다.</p>
  <h2>지금 어디까지 — 얼리 프로토타입 v0.1</h2>
  <p>itch 에 올라간 것은 빌드 파이프라인을 검증하는 v0.1 이다. 코어 루프는 아직 들어오는 중이다.</p>
  <p>지금 할 수 있는 것과 앞으로 올 것:</p>
